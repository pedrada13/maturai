<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MaturAI Câmera</title><style>
:root{--g:#70e000;--bg:#07110b;--panel:#0d1d13;--muted:#9bb3a3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4fff7;font:15px system-ui;min-height:100svh;overflow:hidden}video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#020503}.veil{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),transparent 45%,rgba(0,0,0,.9));pointer-events:none}.top,.bottom{position:fixed;left:16px;right:16px;display:flex;align-items:center;gap:10px;z-index:2}.top{top:calc(14px + env(safe-area-inset-top))}.bottom{bottom:calc(16px + env(safe-area-inset-bottom));flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.4px}.pill,button,select,input{border:1px solid #ffffff20;background:#09130dcc;color:white;border-radius:14px;padding:11px 14px;backdrop-filter:blur(12px)}button{font-weight:800}button.primary{background:var(--g);color:#07110b;border:0}.pill{font-size:12px;margin-left:auto}.ok{color:var(--g)}.setup{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#173c23,#061009 55%);z-index:4;padding:24px}.card{width:min(480px,100%);background:#0a1710dd;border:1px solid #ffffff17;border-radius:24px;padding:26px;box-shadow:0 30px 90px #0008}.card h1{margin:0 0 8px;font-size:34px}.card p{color:var(--muted);line-height:1.5}.row{display:flex;gap:10px}.row input{min-width:0;flex:1}.hidden{display:none!important}.stats{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}.menu{position:fixed;right:16px;bottom:86px;width:min(360px,calc(100vw - 32px));background:#07100bf2;border:1px solid #ffffff18;border-radius:22px;padding:16px;z-index:5;box-shadow:0 25px 80px #0009;backdrop-filter:blur(18px)}.menu h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid button.active{background:var(--g);color:#07110b;border-color:transparent}.field{margin-top:14px}.field label{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px}.field input[type=range]{width:100%;accent-color:var(--g);padding:0}.hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}
.debugbox{position:fixed;left:10px;right:10px;top:72px;max-height:42vh;overflow:auto;background:#000e;border:1px solid #70e00088;border-radius:12px;padding:10px;z-index:9;color:#baff84;font:11px/1.35 monospace;white-space:pre-wrap}.debugbox button{position:sticky;float:right;top:0;padding:5px 8px}.debugbox.hidden{display:none!important}
</style></head><body><video id="preview" autoplay muted playsinline></video><div class="veil"></div><pre id="debugBox" class="debugbox hidden"><button id="debugClear">limpar</button><span id="debugText"></span></pre><div class="top"><span class="brand">MaturAI</span><span id="state" class="pill">desconectada</span></div><div class="bottom"><select id="devices"></select><button id="flip">Trocar câmera</button><button id="settings">FPS/Bitrate</button><button id="screen">Escurecer</button><span id="stats" class="stats"></span></div><section id="setup" class="setup"><div class="card"><h1>Câmera MaturAI</h1><p>Identifique este celular. O vídeo é enviado por WebRTC ao hub, com FPS e bitrate configuráveis.</p><div class="row"><input id="camId" value="1" maxlength="32" aria-label="ID da câmera"><button id="start" class="primary">Transmitir</button></div><p id="error"></p></div></section><aside id="menu" class="menu hidden"><h2>Qualidade da transmissão</h2><div class="grid" id="fpsBtns"></div><div class="field"><label><span>Resolucao</span><b id="resLabel"></b></label><div class="grid" id="resBtns"></div></div><div class="field"><label><span>Bitrate WebRTC</span><b id="brLabel"></b></label><input id="bitrate" type="range" min="500" max="20000" step="500"></div><div class="hint">Para 4 câmeras no Dell, comece em 5 FPS e 1500-3000 Kbps. 24/30 FPS e bitrate alto são úteis para teste, mas pesam mais no notebook.</div></aside><script>
const $=s=>document.querySelector(s),video=$('#preview'),state=$('#state');let DEBUG=false,debugLines=[];let pc,stream,deviceId,statsTimer,sender,reconnecting=false,reconnectTimer;const FPS=[5,10,15,24,30],RES={360:[640,360],540:[960,540],720:[1280,720],1080:[1920,1080],1440:[2560,1440]};let cfg={fps:+localStorage.maturaiFps||10,bitrate:+localStorage.maturaiBitrate||4000,res:+localStorage.maturaiRes||720};

function safe(v){try{return JSON.parse(JSON.stringify(v))}catch(e){return String(v)}}
function debugLog(event,data={}){if(!DEBUG)return;const line=`${new Date().toLocaleTimeString()} ${event} ${JSON.stringify(safe(data))}`;debugLines.push(line);if(debugLines.length>120)debugLines.shift();$('#debugText').textContent=debugLines.join('\n');fetch('/api/debug/client',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({camera_id:$('#camId')?.value||'?',event,data:safe(data)})}).catch(()=>{})}
async function initDebug(){try{DEBUG=!!(await fetch('/api/debug/config',{cache:'no-store'}).then(r=>r.json())).enabled}catch(e){}if(!DEBUG)return;$('#debugBox').classList.remove('hidden');$('#debugClear').onclick=()=>{debugLines=[];$('#debugText').textContent=''};window.addEventListener('error',e=>debugLog('window.error',{message:e.message,stack:e.error?.stack}));window.addEventListener('unhandledrejection',e=>debugLog('promise.reject',{reason:String(e.reason),stack:e.reason?.stack}));debugLog('navigator',{ua:navigator.userAgent,secure:isSecureContext,connection:navigator.connection&&{type:navigator.connection.effectiveType,downlink:navigator.connection.downlink,rtt:navigator.connection.rtt}})}

function renderControls(){const box=$('#fpsBtns');box.innerHTML=FPS.map(f=>`<button data-fps="${f}" class="${cfg.fps===f?'active':''}">${f} FPS</button>`).join('');const rb=$('#resBtns');rb.innerHTML=Object.keys(RES).map(r=>`<button data-res="${r}" class="${cfg.res===+r?'active':''}">${r}p</button>`).join('');$('#resLabel').textContent=cfg.res+'p';$('#bitrate').value=cfg.bitrate;$('#brLabel').textContent=cfg.bitrate>=1000?(cfg.bitrate/1000).toFixed(cfg.bitrate%1000?1:0)+' Mbps':cfg.bitrate+' Kbps';box.querySelectorAll('button').forEach(b=>b.onclick=async()=>{cfg.fps=+b.dataset.fps;localStorage.maturaiFps=cfg.fps;renderControls();await applyQuality()});rb.querySelectorAll('button').forEach(b=>b.onclick=async()=>{cfg.res=+b.dataset.res;localStorage.maturaiRes=cfg.res;renderControls();await restartMedia()})}
async function waitIce(p){if(p.iceGatheringState==='complete')return;await new Promise(r=>{const f=()=>{if(p.iceGatheringState==='complete'){p.removeEventListener('icegatheringstatechange',f);r()}};p.addEventListener('icegatheringstatechange',f)})}
async function openCamera(id,w,h,mode='exact'){
 const dim=mode==='exact'?{width:{exact:w},height:{exact:h}}:mode==='ideal'?{width:{ideal:w},height:{ideal:h}}:{};
 const videoConstraints={deviceId:id?{exact:id}:undefined,facingMode:id?undefined:{ideal:'environment'},...dim,frameRate:{ideal:cfg.fps,max:cfg.fps}};
 debugLog('camera.try',{mode,w,h,fps:cfg.fps,constraints:videoConstraints});
 return navigator.mediaDevices.getUserMedia({audio:false,video:videoConstraints})
}
async function media(id){
 const [w,h]=RES[cfg.res]||RES[720],oldStream=stream;
 let next=null,used='';const errors=[];
 for(const mode of ['exact','ideal','default']){
  try{next=await openCamera(id,w,h,mode);used=mode;break}catch(e){errors.push({mode,name:e.name,message:e.message,constraint:e.constraint});debugLog('camera.try.error',errors.at(-1))}
 }
 if(!next){debugLog('camera.failed',{requested:{w,h,fps:cfg.fps},errors});throw new Error(`Camera recusou todas as configuracoes: ${errors.map(e=>e.mode+': '+e.name+' '+e.message).join(' | ')}`)}
 stream=next;video.srcObject=stream;
 const tr=stream.getVideoTracks()[0],actual=tr.getSettings(),caps=tr.getCapabilities?.()||{};tr.contentHint='detail';
 deviceId=actual.deviceId;
 const gotW=actual.width||video.videoWidth||'?',gotH=actual.height||video.videoHeight||'?';
 $('#resLabel').textContent=`${cfg.res}p → ${gotW}×${gotH}`+(used==='exact'?'':` · ${used}`);
 state.textContent=`${gotW}×${gotH} · ${actual.frameRate||cfg.fps} FPS`;
 debugLog('camera.open',{requested:{w,h,fps:cfg.fps},used,settings:actual,capabilities:caps,constraints:tr.getConstraints?.(),errors});
 oldStream?.getTracks().forEach(t=>t.stop());await devices();return tr
}
async function devices(){const ds=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind==='videoinput');$('#devices').innerHTML=ds.map((d,i)=>`<option value="${d.deviceId}">${d.label||'Câmera '+(i+1)}</option>`).join('');$('#devices').value=deviceId||''}
async function restartMedia(){try{state.textContent='aplicando qualidade';const tr=await media(deviceId);sender=pc?.getSenders().find(s=>s.track?.kind==='video');if(sender)await sender.replaceTrack(tr);await applyQuality();state.textContent=`${tr.getSettings().width||'?'}×${tr.getSettings().height||'?'} · ${cfg.fps} FPS`}catch(e){$('#error').textContent='Qualidade indisponivel: '+e.message;state.textContent='falha na qualidade'}}
async function applyQuality(){const tr=stream?.getVideoTracks()[0];const [w,h]=RES[cfg.res]||RES[720];if(tr){try{await tr.applyConstraints({width:{ideal:w},height:{ideal:h},frameRate:{ideal:cfg.fps,max:cfg.fps}});debugLog('constraints.applied',{wanted:{w,h,fps:cfg.fps},settings:tr.getSettings(),constraints:tr.getConstraints?.()})}catch(e){debugLog('constraints.error',{name:e.name,message:e.message,constraint:e.constraint,wanted:{w,h,fps:cfg.fps}})}}sender=sender||pc?.getSenders().find(s=>s.track?.kind==='video');if(sender){const before=sender.getParameters(),p=sender.getParameters();p.encodings=p.encodings&&p.encodings.length?p.encodings:[{}];p.encodings[0].maxBitrate=cfg.bitrate*1000;p.encodings[0].maxFramerate=cfg.fps;p.encodings[0].scaleResolutionDownBy=1.0;p.degradationPreference='maintain-resolution';try{await sender.setParameters(p);debugLog('sender.parameters',{before,after:sender.getParameters(),track:tr?.getSettings(),contentHint:tr?.contentHint})}catch(e){debugLog('sender.setParameters.error',{name:e.name,message:e.message,before,wanted:p})}}}

function scheduleReconnect(){if(reconnecting||reconnectTimer)return;reconnectTimer=setTimeout(()=>{reconnectTimer=null;reconnect()},3000)}
async function connect(){try{$('#error').textContent='';debugLog('connect.start',{cameraId:$('#camId').value,cfg});if(!window.isSecureContext)throw Error('Abra pelo endereço HTTPS do Tailscale.');const id=$('#camId').value.trim();if(!id)throw Error('Informe um ID.');localStorage.maturaiCam=id;const track=await media();pc=new RTCPeerConnection({bundlePolicy:'max-bundle'});sender=pc.addTrack(track,stream);await applyQuality();pc.onconnectionstatechange=()=>{debugLog('pc.connection',{connection:pc.connectionState,ice:pc.iceConnectionState,signaling:pc.signalingState});state.textContent=`PC ${pc.connectionState} · ICE ${pc.iceConnectionState}`;state.classList.toggle('ok',pc.connectionState==='connected');if(pc.connectionState==='failed')scheduleReconnect()};pc.oniceconnectionstatechange=()=>{debugLog('pc.ice',{connection:pc.connectionState,ice:pc.iceConnectionState});state.textContent=`PC ${pc.connectionState} · ICE ${pc.iceConnectionState}`;if(pc.iceConnectionState==='failed')scheduleReconnect()};const offer=await pc.createOffer();await pc.setLocalDescription(offer);await waitIce(pc);const r=await fetch('/api/offer/camera',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({camera_id:id,sdp:pc.localDescription.sdp,type:pc.localDescription.type})});if(!r.ok)throw Error(await r.text());await pc.setRemoteDescription(await r.json());$('#setup').classList.add('hidden');statsTimer=setInterval(showStats,1000);navigator.wakeLock?.request('screen').catch(()=>{})}catch(e){debugLog('connect.error',{name:e.name,message:e.message,constraint:e.constraint,stack:e.stack});$('#error').textContent=`${e.name||'Erro'}: ${e.message}`}}
async function reconnect(){if(document.hidden||reconnecting)return;reconnecting=true;try{pc?.close();clearInterval(statsTimer);await connect()}finally{reconnecting=false}}
async function showStats(){const reports=await pc.getStats();let out='',dbg={};reports.forEach(x=>{if(x.type==='outbound-rtp'&&x.kind==='video'){out=`${x.frameWidth||'?'}×${x.frameHeight||'?'} encode · ${Math.round(x.framesPerSecond||0)} fps · ${Math.round((x.bytesSent||0)/1024)} KB · ${cfg.bitrate>=1000?(cfg.bitrate/1000).toFixed(cfg.bitrate%1000?1:0)+' Mbps':cfg.bitrate+' Kbps'}`;dbg.outbound=x}if(x.type==='remote-inbound-rtp'&&x.kind==='video')dbg.remote=x;if(x.type==='media-source'&&x.kind==='video')dbg.source=x;if(x.type==='candidate-pair'&&x.state==='succeeded')dbg.candidate=x});$('#stats').textContent=out;if(DEBUG){dbg.track=stream?.getVideoTracks()[0]?.getSettings();dbg.sender=sender?.getParameters();debugLog('webrtc.stats',dbg)}}
$('#start').onclick=connect;$('#camId').value=localStorage.maturaiCam||'1';$('#settings').onclick=()=>$('#menu').classList.toggle('hidden');$('#bitrate').oninput=async e=>{cfg.bitrate=+e.target.value;localStorage.maturaiBitrate=cfg.bitrate;renderControls();await applyQuality()};$('#devices').onchange=async e=>{const tr=await media(e.target.value);sender=pc?.getSenders().find(s=>s.track?.kind==='video');if(sender)await sender.replaceTrack(tr);await applyQuality()};$('#flip').onclick=async()=>{const o=[...$('#devices').options],i=o.findIndex(x=>x.value===deviceId);if(o.length)$('#devices').value=o[(i+1)%o.length].value,$('#devices').dispatchEvent(new Event('change'))};$('#screen').onclick=()=>{document.body.style.filter=document.body.style.filter?'':'brightness(.02)'};document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pc?.connectionState==='failed')scheduleReconnect()});renderControls();initDebug();
</script></body></html>
