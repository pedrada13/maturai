<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MaturAI Monitor</title><style>
:root{--a:#8cff32;--bg:#07100b;--card:#0d1811;--muted:#91a697}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5fff7;font:14px system-ui}header{position:sticky;top:0;z-index:3;background:#07100bea;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12;padding:16px 22px;display:flex;align-items:center;gap:12px}.logo{font-size:21px;font-weight:900}.leaf{width:12px;height:20px;background:var(--a);border-radius:100% 0 100% 0;transform:rotate(25deg)}#summary{margin-left:auto;color:var(--muted)}button{border:1px solid #ffffff20;background:#09130dcc;color:white;border-radius:12px;padding:9px 12px;font-weight:800}.ctrl{position:relative}.menu{position:absolute;right:0;top:44px;width:320px;background:#07100bf2;border:1px solid #ffffff18;border-radius:18px;padding:14px;box-shadow:0 25px 80px #0009;backdrop-filter:blur(18px)}.hidden{display:none}.fps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.fps button.active{background:var(--a);color:#07100b;border-color:transparent}.field{margin-top:14px}.field label{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px}.field input{width:100%;accent-color:var(--a)}main{padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}.tile{background:var(--card);border:1px solid #ffffff10;border-radius:18px;overflow:hidden;box-shadow:0 14px 40px #0004}.stage{aspect-ratio:16/9;background:#020403;position:relative;display:grid;place-items:center}.stage img{width:100%;height:100%;object-fit:contain}.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.badge{position:absolute;top:12px;left:12px;padding:6px 9px;border-radius:10px;background:#06100ccc;color:var(--a);font-size:12px}.meta{display:flex;align-items:center;padding:12px 14px;gap:10px}.meta strong{font-size:15px}.meta small{color:var(--muted);margin-left:auto}.meta a{color:#07100b;background:var(--a);padding:7px 10px;border-radius:10px;text-decoration:none;font-weight:800}.empty{grid-column:1/-1;min-height:55vh;display:grid;place-items:center;color:var(--muted)}body.single main{display:block;padding:0}.single .tile{border:0;border-radius:0}.single .stage{height:calc(100vh - 58px);aspect-ratio:auto}.single .meta{position:fixed;left:12px;right:12px;bottom:12px;background:#07100bec;border-radius:14px}.single header #summary{display:none}@media(max-width:720px){header{padding:12px;gap:8px}.menu{right:-8px;width:calc(100vw - 24px)}}
</style></head><body><header><span class="leaf"></span><span class="logo">MaturAI</span><span id="summary">procurando câmeras</span><div class="ctrl"><button id="quality">FPS/Bitrate</button><div id="menu" class="menu hidden"><div class="fps" id="fpsBtns"></div><div class="field"><label><span>Bitrate do viewer</span><b id="brLabel"></b></label><input id="bitrate" type="range" min="500" max="20000" step="500"></div></div></div></header><main id="grid"></main><script>
const grid=document.querySelector('#grid'),one=new URLSearchParams(location.search).get('cam');if(one)document.body.classList.add('single');const FPS=[5,12,24,30];let cfg={fps:+localStorage.maturaiViewerFps||5,bitrate:+localStorage.maturaiViewerBitrate||2500};let lastIds='',detectionBusy=false,statusReady=false,reloadPending=false,lastOnline=new Map();
function brText(v){return v>=1000?(v/1000).toFixed(v%1000?1:0)+' Mbps':v+' Kbps'}
function renderControls(){document.querySelector('#fpsBtns').innerHTML=FPS.map(f=>`<button data-fps="${f}" class="${cfg.fps===f?'active':''}">${f}</button>`).join('');document.querySelector('#bitrate').value=cfg.bitrate;document.querySelector('#brLabel').textContent=brText(cfg.bitrate);document.querySelectorAll('#fpsBtns button').forEach(b=>b.onclick=()=>{cfg.fps=+b.dataset.fps;localStorage.maturaiViewerFps=cfg.fps;renderControls();reloadStreams()})}
function streamUrl(id){return `/api/mjpeg/${encodeURIComponent(id)}?fps=${cfg.fps}&bitrate_kbps=${cfg.bitrate}&v=${Date.now()}`}
function card(c){const d=document.createElement('article');d.className='tile';d.dataset.id=c.id;d.innerHTML=`<div class="stage"><img alt="Câmera ${c.id}" src="${streamUrl(c.id)}"><canvas></canvas><span class="badge">MJPEG ${cfg.fps} FPS</span></div><div class="meta"><strong>Câmera ${c.id}</strong><small>${c.width||'?'}×${c.height||'?'} · ${brText(cfg.bitrate)} · ${c.received||0} frames</small>${one?'':'<a href="/viewer?cam='+encodeURIComponent(c.id)+'" target="_blank">Analisar ↗</a>'}</div>`;const img=d.querySelector('img');img.onerror=()=>{d.querySelector('.badge').textContent='reconectando';setTimeout(()=>{img.src=streamUrl(c.id)},1500)};img.onload=()=>d.querySelector('.badge').textContent=`ao vivo · ${cfg.fps} FPS`;return d}
function drawBoxes(tile,data){const img=tile.querySelector('img'),cv=tile.querySelector('canvas'),stage=tile.querySelector('.stage');if(!img.naturalWidth)return;const dpr=devicePixelRatio||1,w=stage.clientWidth,h=stage.clientHeight;if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const scale=Math.min(w/img.naturalWidth,h/img.naturalHeight),rw=img.naturalWidth*scale,rh=img.naturalHeight*scale,ox=(w-rw)/2,oy=(h-rh)/2;ctx.lineWidth=2;ctx.font='bold 13px system-ui';for(const d of data.detections||[]){const x=ox+d.x1*rw,y=oy+d.y1*rh,bw=(d.x2-d.x1)*rw,bh=(d.y2-d.y1)*rh,label=`${d.label||'face'} ${Math.round(d.confidence*100)}%`;ctx.strokeStyle='#8cff32';ctx.fillStyle='#8cff32';ctx.strokeRect(x,y,bw,bh);const tw=ctx.measureText(label).width+10;ctx.fillRect(x,Math.max(0,y-23),tw,23);ctx.fillStyle='#07100b';ctx.fillText(label,x+5,Math.max(16,y-7))}const badge=tile.querySelector('.badge');if(data.inference_ms!=null)badge.textContent=`YOLO ${data.detect_fps||0} FPS · ${data.inference_ms} ms · ${data.detections.length} face(s)`}
async function refreshDetections(){if(detectionBusy)return;detectionBusy=true;try{for(const tile of grid.querySelectorAll('.tile')){try{const id=tile.dataset.id,data=await fetch(`/api/detections/${encodeURIComponent(id)}?v=${Date.now()}`,{cache:'no-store'}).then(r=>r.json());if(data.age_ms==null||data.age_ms>1500)data.detections=[];drawBoxes(tile,data)}catch(e){const cv=tile.querySelector('canvas');cv?.getContext('2d').clearRect(0,0,cv.width,cv.height)}}}finally{detectionBusy=false}}
function reloadStreams(){grid.querySelectorAll('.tile').forEach(tile=>{const id=tile.dataset.id,img=tile.querySelector('img'),badge=tile.querySelector('.badge');badge.textContent='aplicando';img.src=streamUrl(id);const sm=tile.querySelector('small');if(sm)sm.textContent=sm.textContent.replace(/· .*? ·/,`· ${brText(cfg.bitrate)} ·`)})}
async function refresh(){try{const data=await fetch('/api/status',{cache:'no-store'}).then(r=>r.json());
 const current=new Map(data.cameras.map(c=>[c.id,!!c.online]));
 if(statusReady&&!reloadPending){let changed=false;for(const [id,on] of current){if(lastOnline.has(id)&&lastOnline.get(id)!==on)changed=true;if(!lastOnline.has(id)&&on)changed=true}for(const [id,on] of lastOnline){if(on&&!current.has(id))changed=true}if(changed){reloadPending=true;document.querySelector('#summary').textContent='camera reconectou/desconectou · atualizando';setTimeout(()=>location.reload(),700);return}}
 lastOnline=current;statusReady=true;
 let cams=data.cameras.filter(c=>c.online&&(!one||c.id===one));document.querySelector('#summary').textContent=`${cams.length} câmera(s) online`;const idList=cams.map(c=>c.id).join('|');if(idList===lastIds){for(const c of cams){const el=grid.querySelector(`[data-id="${CSS.escape(c.id)}"] small`);if(el)el.textContent=`${c.width||'?'}×${c.height||'?'} · ${brText(cfg.bitrate)} · ${c.received||0} frames`}return}lastIds=idList;grid.innerHTML='';if(!cams.length){grid.innerHTML='<div class="empty">Nenhuma câmera disponível. Abra /camera no celular e inicie a transmissão.</div>';return}for(const c of cams)grid.appendChild(card(c))}catch(e){document.querySelector('#summary').textContent='hub indisponível'}}
document.querySelector('#quality').onclick=()=>document.querySelector('#menu').classList.toggle('hidden');document.querySelector('#bitrate').oninput=e=>{cfg.bitrate=+e.target.value;localStorage.maturaiViewerBitrate=cfg.bitrate;renderControls();reloadStreams()};renderControls();refresh();setInterval(refresh,2000);setInterval(refreshDetections,100);window.addEventListener('resize',refreshDetections);
</script></body></html>
